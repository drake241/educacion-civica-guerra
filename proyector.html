<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proyector — Valmira vs Cerro Azul</title>
<link rel="stylesheet" href="styles.css?v=20261103">
</head>
<body>
<div class="wrap login-box" id="login">
  <div class="card login-box">
    <h1>Proyector</h1>
    <label class="field">Contraseña</label>
    <input type="password" id="pin" value="">
    <button class="btn" id="pinBtn">Entrar</button>
  </div>
</div>
<div class="wrap hidden projector-wrap" id="main">
  <header class="projector-header">
    <div>
      <h1>Cordillera del Sur</h1>
      <p class="lead">Sala <strong id="roomCode">—</strong></p>
    </div>
    <div class="btn-row projector-header-actions">
      <button type="button" class="btn btn-secondary" id="copyJoin">Copiar enlace alumnos</button>
      <a class="btn btn-secondary" id="joinLink" href="#" target="_blank" rel="noopener">Abrir join</a>
      <button class="btn" id="createRoom">Nueva sala</button>
      <button class="btn" id="startWar">Iniciar guerra</button>
    </div>
  </header>
  <div class="phase-strip" id="phaseStrip" aria-label="Fase de la ronda"></div>
  <p class="round-label">Ronda <strong id="roundTxt">1</strong></p>
  <div class="card roster-card" id="rosterCard">
    <p class="roster-summary" id="rosterSummary">Jugadores: —</p>
    <p class="roster-vote note hidden" id="rosterVote" aria-live="polite"></p>
    <details>
      <summary>Equipo en sala</summary>
      <ul id="rosterList" class="roster-list"></ul>
    </details>
  </div>
  <div class="crisis-banner crisis-banner-compact" id="crisisBox"></div>
  <div class="world-map-wrap projector-map" id="worldMap" aria-live="polite"></div>
  <div class="btn-row projector-controls" id="controls"></div>
  <details class="card details-card">
    <summary>Historial de eventos (<span id="eventCount">0</span>)</summary>
    <ul id="eventLog" class="event-log-list"></ul>
  </details>
  <p class="error hidden" id="err"></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=20261102"></script>
<script src="js/game-content.js?v=20261102"></script>
<script src="js/world-map.js?v=20261102"></script>
<script src="js/supabase-api.js?v=20261103"></script>
<script>
const loginEl = document.getElementById("login");
const mainEl = document.getElementById("main");
let roomId = sessionStorage.getItem("civica_room_id");
let roomCode = sessionStorage.getItem("civica_room_code");
let room = null;
let players = [];
/** @type {{ valmira?: object, cerro?: object } | null} */
let lastMetersSnapshot = null;
let votePoll = null;

const PHASE_ORDER = ["lobby", "intro", "discuss", "vote", "reveal", "consequence"];

document.getElementById("pinBtn").onclick = () => {
  if (document.getElementById("pin").value !== TEACHER_PIN) {
    alert("Pin incorrecto");
    return;
  }
  loginEl.classList.add("hidden");
  mainEl.classList.remove("hidden");
  boot();
};

function joinUrl(code) {
  const base = location.href.replace(/proyector\.html.*$/, "");
  return `${base}join.html?room=${encodeURIComponent(code)}`;
}

async function ensureRoom() {
  if (roomId && roomCode) return;
  const created = await CivicaSupabase.createRoom();
  roomId = created.room_id;
  roomCode = created.code;
  sessionStorage.setItem("civica_room_id", roomId);
  sessionStorage.setItem("civica_room_code", roomCode);
}

function renderMap(prevV, prevC) {
  const el = document.getElementById("worldMap");
  const c = CivicaContent.get();
  if (!room || !el) return;
  if (typeof CivicaWorldMap === "undefined") {
    el.innerHTML = `<p class="error">No cargó el mapa. Refrescá con Ctrl+Shift+R.</p>`;
    return;
  }
  const log = room.event_log ?? [];
  const last = log[log.length - 1];
  CivicaWorldMap.render(el, {
    paises: c.paises,
    valmiraMeters: room.valmira_meters,
    cerroMeters: room.cerro_meters,
    prevValmira: prevV,
    prevCerro: prevC,
    scoreFn: CivicaContent.score,
    meterLabel: CivicaContent.meterLabel,
    statusIcons: CivicaContent.statusIcons,
    regimenLabel: CivicaContent.regimenLabel,
    subphase: room.subphase,
    lastCross: last?.cross ?? null,
  });
}

function renderPhaseStrip() {
  const strip = document.getElementById("phaseStrip");
  const sub = room?.subphase ?? "lobby";
  const subIdx = PHASE_ORDER.indexOf(sub);
  strip.innerHTML = PHASE_ORDER.map((id) => {
    const active = id === sub ? " is-active" : "";
    const done = subIdx >= 0 && PHASE_ORDER.indexOf(id) < subIdx ? " is-done" : "";
    return `<span class="phase-chip${active}${done}">${CivicaContent.subphaseLabel(id, room?.phase)}</span>`;
  }).join("");
}

function renderCrisis() {
  const crisisBox = document.getElementById("crisisBox");
  const round = CivicaContent.getRound(room.round_index);
  if (room.subphase === "intro") {
    const ig = CivicaContent.get().introGuerra;
    crisisBox.innerHTML = `<h2>${ig.titulo}</h2><p>${ig.lead}</p>` +
      (ig.contexto ? `<details class="crisis-more"><summary>Contexto</summary><p>${ig.contexto}</p></details>` : "");
  } else if (round) {
    crisisBox.innerHTML = `<h2>${round.titulo}</h2><p>${round.lead}</p>` +
      (round.contexto && (room.subphase === "discuss" || room.subphase === "intro")
        ? `<details class="crisis-more"><summary>Contexto</summary><p>${round.contexto}</p></details>`
        : "");
  } else {
    crisisBox.innerHTML = `<h2>Fin de la partida</h2>`;
  }
}

async function renderRoster() {
  const v = players.filter((p) => p.country === "valmira");
  const c = players.filter((p) => p.country === "cerroAzul");
  document.getElementById("rosterSummary").textContent =
    `${players.length} en sala · Valmira ${v.length} · Cerro Azul ${c.length}`;
  const ul = document.getElementById("rosterList");
  ul.innerHTML =
    players
      .map((p) => {
        const tag = p.country === "valmira" ? "valmira" : "cerro";
        return `<li><span class="tag tag-${tag}">${p.nickname}</span> <span class="roster-role">${roleLabel(p.role, p.country)}</span></li>`;
      })
      .join("") || "<li>Nadie ha entrado aún.</li>";

  const voteEl = document.getElementById("rosterVote");
  if (room?.subphase === "vote" && room?.phase === "playing") {
    const votes = await CivicaSupabase.fetchVotes(roomId, room.round_index);
    const voted = new Set(votes.map((x) => x.player_id));
    const nVoted = players.filter((p) => voted.has(p.id)).length;
    voteEl.classList.remove("hidden");
    voteEl.textContent = `Votación: ${nVoted} de ${players.length} ya votaron`;
  } else if (room?.subphase === "lobby") {
    voteEl.classList.remove("hidden");
    voteEl.textContent = "En espera: los alumnos pueden entrar con el código.";
  } else {
    voteEl.classList.add("hidden");
    voteEl.textContent = "";
  }
}

function renderEvents() {
  const ul = document.getElementById("eventLog");
  const log = room?.event_log ?? [];
  document.getElementById("eventCount").textContent = String(log.length);
  const recent = log.slice(-8).reverse();
  ul.innerHTML =
    recent
      .map((e) => {
        let t = `R${e.round}: ${e.valmira}`;
        if (e.cerro) t += ` · ${e.cerro}`;
        if (e.cross) t += ` → ${e.cross}`;
        return `<li>${t}</li>`;
      })
      .join("") || "<li>—</li>";
}

function renderControls() {
  const box = document.getElementById("controls");
  const sub = room?.subphase;
  box.innerHTML = "";
  const add = (label, fn) => {
    const b = document.createElement("button");
    b.className = "btn btn-secondary";
    b.textContent = label;
    b.onclick = fn;
    box.appendChild(b);
  };
  if (sub === "intro") add("Abrir discusión", () => teacherSub("discuss"));
  if (sub === "discuss") add("Abrir votación", () => teacherSub("vote"));
  if (sub === "vote") add("Cerrar voto y revelar", closeVoteAndReveal);
  if (sub === "reveal") add("Aplicar consecuencias", applyConsequences);
  if (sub === "consequence" && room.phase === "playing") add("Siguiente ronda", nextRound);
  if (room?.phase === "finished" && !room.ending) add("Calcular final", calcEnding);
}

async function teacherSub(subphase) {
  await CivicaSupabase.teacherSetSubphase(roomId, TEACHER_PIN, subphase);
  await refresh();
}

async function closeVoteAndReveal() {
  const round = CivicaContent.getRound(room.round_index);
  const votes = await CivicaSupabase.fetchVotes(roomId, room.round_index);
  const vTally = CivicaContent.tallyValmiraOptions(votes, players);
  const cTally = CivicaContent.tallyCerro(votes, players);
  let vOpt = vTally.chosen;
  let cOpt = cTally.chosen;
  if (!vOpt && round?.opciones?.[0]) vOpt = round.opciones[0].id;
  if (!cOpt && round?.opciones?.[0]) cOpt = round.opciones[0].id;
  if (!cTally.approved) cOpt = null;
  await CivicaSupabase.teacherCloseVote(roomId, TEACHER_PIN, vOpt, cOpt || "rechazada", cTally.yes, cTally.no);
  await refresh();
}

async function applyConsequences() {
  const round = CivicaContent.getRound(room.round_index);
  const rr = room.round_results?.[String(room.round_index)];
  const vm = room.valmira_meters;
  const cm = room.cerro_meters;
  const vOpt = CivicaContent.findOption(round, rr?.valmira_chosen);
  const cOpt = rr?.cerro_chosen && rr.cerro_chosen !== "rechazada"
    ? CivicaContent.findOption(round, rr.cerro_chosen)
    : null;

  let vDelta = { estabilidad: -5 };
  let cDelta = { apoyo: -3 };
  let vHead = "En Valmira no hubo acuerdo claro.";
  let cHead = "En Cerro Azul la asamblea rechazó la propuesta presidencial.";
  let cross = null;
  let peaceV = false;
  let peaceC = false;

  if (vOpt && !CivicaContent.optionBlocked(vm, vOpt)) {
    vDelta = vOpt.efectos;
    vHead = vOpt.headline;
    if (vOpt.peacePath) peaceV = true;
    if (vOpt.crossEvent) cross = vOpt.crossEvent;
  }
  if (cOpt && !CivicaContent.optionBlocked(cm, cOpt)) {
    cDelta = cOpt.efectos;
    cHead = cOpt.headline;
    if (cOpt.peacePath) peaceC = true;
    if (cOpt.crossEvent) cross = cOpt.crossEvent;
  }

  await CivicaSupabase.teacherApplyConsequence(roomId, TEACHER_PIN, {
    valmiraDelta: vDelta,
    cerroDelta: cDelta,
    valmiraHeadline: vHead,
    cerroHeadline: cHead,
    crossEvent: cross,
    peaceValmira: peaceV,
    peaceCerro: peaceC,
  });
  await refresh();
}

async function nextRound() {
  await CivicaSupabase.teacherNextRound(roomId, TEACHER_PIN);
  await refresh();
}

async function calcEnding() {
  room = await CivicaSupabase.fetchRoom(roomId);
  const fin = CivicaContent.computeEnding(room);
  await CivicaSupabase.teacherSetEnding(roomId, TEACHER_PIN, fin.id);
  await refresh();
}

async function refresh() {
  const prevV = lastMetersSnapshot?.valmira ? { ...lastMetersSnapshot.valmira } : null;
  const prevC = lastMetersSnapshot?.cerro ? { ...lastMetersSnapshot.cerro } : null;

  room = await CivicaSupabase.fetchRoom(roomId);
  players = await CivicaSupabase.fetchPlayers(roomId);

  document.getElementById("roomCode").textContent = roomCode;
  const url = joinUrl(roomCode);
  document.getElementById("joinLink").href = url;

  document.getElementById("roundTxt").textContent = String(room.round_index + 1);
  renderPhaseStrip();
  await renderRoster();
  renderCrisis();
  renderMap(prevV, prevC);
  renderEvents();
  renderControls();

  lastMetersSnapshot = {
    valmira: { ...room.valmira_meters },
    cerro: { ...room.cerro_meters },
  };

  if (votePoll) clearInterval(votePoll);
  votePoll = null;
  if (room?.subphase === "vote") votePoll = setInterval(() => renderRoster(), 3000);
}

document.getElementById("copyJoin").onclick = async () => {
  try {
    await navigator.clipboard.writeText(joinUrl(roomCode));
    document.getElementById("copyJoin").textContent = "¡Copiado!";
    setTimeout(() => {
      document.getElementById("copyJoin").textContent = "Copiar enlace alumnos";
    }, 2000);
  } catch {
    alert(joinUrl(roomCode));
  }
};

document.getElementById("createRoom").onclick = async () => {
  sessionStorage.removeItem("civica_room_id");
  sessionStorage.removeItem("civica_room_code");
  roomId = roomCode = null;
  lastMetersSnapshot = null;
  await ensureRoom();
  CivicaSupabase.subscribeRoom(roomId, refresh);
  await refresh();
};

document.getElementById("startWar").onclick = async () => {
  await CivicaSupabase.teacherStartWar(roomId, TEACHER_PIN);
  await CivicaSupabase.teacherSetSubphase(roomId, TEACHER_PIN, "intro");
  await refresh();
};

async function boot() {
  try {
    CivicaSupabase.init();
    await CivicaContent.load("contenido.json?v=20261102");
    await ensureRoom();
    await refresh();
    CivicaSupabase.subscribeRoom(roomId, refresh);
  } catch (e) {
    document.getElementById("err").textContent = e.message;
    document.getElementById("err").classList.remove("hidden");
  }
}
</script>
</body>
</html>
